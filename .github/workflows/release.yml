name: release

# Публичный релиз: запускается тегом v*, собирает бандл corelix-bundle.zip и публикует его в GitHub Releases.
# Лаунчер (MobiLabs) скачивает последний релиз сам, Actions для этого видеть не нужно.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Сборка
        run: gradle build :mixin-support:bundle --stacktrace

      - name: Дымовой тест
        run: bash scripts/smoke.sh

      - name: Бандл
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist/mods dist/libs
          cp loader/build/libs/corelix-loader.jar dist/
          cp core/build/libs/corelix-core.jar dist/mods/
          cp mixin-support/build/bundle/*.jar dist/libs/
          cp remap/build/libs/corelix-remap.jar dist/libs/
          echo "${TAG}" > dist/VERSION
          (cd dist && zip -r ../corelix-bundle.zip .)
          sha256sum corelix-bundle.zip | cut -d' ' -f1 > corelix-bundle.zip.sha256
          cat corelix-bundle.zip.sha256

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "${TAG}" corelix-bundle.zip corelix-bundle.zip.sha256 \
            --target "${GITHUB_SHA}" --title "Corelix ${TAG}" --generate-notes

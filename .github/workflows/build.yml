name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Сборка
        run: gradle build --stacktrace

      - name: Дымовой тест
        run: bash scripts/smoke.sh

      - name: Проверка ремапа на настоящем клиенте Minecraft
        env:
          CORELIX_VERIFY_DIR: ${{ runner.temp }}/corelix-verify
        run: bash scripts/verify-real.sh

      - name: Бандл библиотек (Mixin, ASM, сервис Mixin)
        run: gradle :mixin-support:bundle --stacktrace

      - name: Проверка Mixin на настоящем клиенте Minecraft
        env:
          CORELIX_VERIFY_DIR: ${{ runner.temp }}/corelix-verify
        run: bash scripts/verify-mixin.sh

      - name: Собрать артефакты
        run: |
          mkdir -p dist/mods dist/libs
          cp loader/build/libs/corelix-loader.jar dist/
          cp core/build/libs/corelix-core.jar dist/mods/
          cp mixin-support/build/bundle/*.jar dist/libs/
          cp remap/build/libs/corelix-remap.jar dist/libs/

      - uses: actions/upload-artifact@v4
        with:
          name: corelix
          path: dist/
          if-no-files-found: error

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Сборка
        run: gradle build --stacktrace

      - name: Дымовой тест
        run: bash scripts/smoke.sh

      - name: Собрать артефакты
        run: |
          mkdir -p dist
          cp loader/build/libs/corelix-loader.jar dist/
          cp core/build/libs/corelix-core.jar dist/

      - uses: actions/upload-artifact@v4
        with:
          name: corelix
          path: dist/
          if-no-files-found: error

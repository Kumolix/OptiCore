name: inspect

# Временная разведка API (печатает интерфейсы Mixin и образец сервиса Fabric в лог).
on:
  push:
    paths:
      - 'scripts/inspect/**'
      - '.github/workflows/inspect.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Mixin API
        run: bash scripts/inspect/mixin-api.sh
